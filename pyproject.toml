[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vipeak-api"
version = "0.1.0"
description = "Async client for the Vipeak AI (123vips.com) Seedance Spicy & Wan NSFW video generation API"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Vipeak AI", email = "zzxcpl@sina.com" }]
keywords = [
    "seedance", "seedance-spicy", "wan", "wan-nsfw", "nsfw-api",
    "ai-video", "text-to-video", "image-to-video", "ai-video-api",
    "uncensored-ai", "adult-ai-video", "ai-companion", "123vips",
    "mcp", "mcp-server", "model-context-protocol", "claude", "cursor",
    "ai-agent", "codex",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["httpx>=0.24"]

[project.urls]
Homepage = "https://123vips.com/"
Documentation = "https://github.com/wideeyededi/uncensored-nsfw-ai-video-api"
Repository = "https://github.com/wideeyededi/vipeak-api"

[project.scripts]
vipeak-mcp = "vipeak_mcp:main"

[tool.setuptools]
packages = ["vipeak_api", "vipeak_mcp"]
